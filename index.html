<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8BC34A">
  
  <meta property="og:type" content="business.business">
  <meta property="og:title" content="Grupo Sibrü">
  <meta property="og:description" content="Venta de pollo, snacks y más | Cuautitlán Izcalli, Edo. Méx.">
  <meta property="og:image" content="https://res.cloudinary.com/sdhnyr5e/image/upload/v1793814011/Retrato_Google_con_Sonrisa.png">
  <meta property="og:url" content="https://mediossibru-2026.github.io/sibru-tarjetas/">
  <meta property="og:site_name" content="Grupo Sibrü">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Grupo Sibrü">
  <meta name="twitter:description" content="Venta de pollo, snacks y más">
  <meta name="twitter:image" content="https://res.cloudinary.com/sdhnyr5e/image/upload/v1793814011/Retrato_Google_con_Sonrisa.png">
  
  <title>Grupo Sibrü | Tarjeta Digital</title>
  
  <style>
    :root {
      --verde-claro: #8BC34A;
      --verde-medio: #689F38;
      --verde-oscuro: #33691E;
      --naranja: #FF6B35;
      --blanco: #FFFFFF;
      --negro: #1a1a1a;
      --gris-claro: #f5f5f7;
      --gris-medio: #888888;
      --sombra-suave: rgba(0, 0, 0, 0.08);
      --sombra-media: rgba(0, 0, 0, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gris-claro);
      min-height: 100vh;
      color: var(--negro);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--blanco);
      min-height: 100vh;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(139, 195, 74, 0.3);
    }

    .banner {
      position: relative;
      height: 200px;
      background: linear-gradient(135deg, var(--verde-claro) 0%, var(--verde-medio) 50%, var(--verde-oscuro) 100%);
      overflow: hidden;
    }

    .logo-wrapper {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      background: var(--blanco);
      border-radius: 50%;
      padding: 10px;
      box-shadow: 0 12px 32px rgba(139, 195, 74, 0.4);
      z-index: 10;
      border: 4px solid var(--blanco);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .logo-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--naranja);
      color: var(--blanco);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .header-info {
      text-align: center;
      padding: 70px 20px 24px;
    }

    .company-name {
      font-size: 26px;
      font-weight: 700;
      color: var(--negro);
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 15px;
      color: var(--gris-medio);
      margin-bottom: 10px;
    }

    .location-text {
      font-size: 13px;
      color: var(--verde-medio);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
    }

    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 24px 20px;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--negro);
      transition: transform 0.2s;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .action-btn:hover { transform: translateY(-2px); }

    .action-icon {
      width: 60px;
      height: 60px;
      background: var(--blanco);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--sombra-media);
      border: 2px solid var(--verde-claro);
      transition: all 0.3s;
    }

    .action-btn:hover .action-icon {
      background: linear-gradient(135deg, var(--verde-claro), var(--verde-medio));
    }

    .action-btn:hover .action-icon svg { fill: var(--blanco); }

    .action-icon svg {
      width: 26px;
      height: 26px;
      fill: var(--verde-medio);
      transition: fill 0.3s;
    }

    .action-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gris-medio);
    }

    .info-section {
      padding: 24px 20px;
      border-bottom: 1px solid #eee;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .info-item:last-child { margin-bottom: 0; }

    .info-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--verde-claro), var(--verde-medio));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px var(--sombra-suave);
    }

    .info-icon svg {
      width: 22px;
      height: 22px;
      fill: var(--blanco);
    }

    .info-content { flex: 1; }

    .info-label {
      font-size: 12px;
      color: var(--gris-medio);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .info-value {
      font-size: 15px;
      color: var(--negro);
      font-weight: 500;
    }

    .info-value a {
      color: var(--verde-medio);
      text-decoration: none;
      font-weight: 600;
    }

    .info-value a:hover { text-decoration: underline; }

    .links-section {
      padding: 24px 20px;
      border-bottom: 1px solid #eee;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--verde-oscuro);
      margin-bottom: 16px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--blanco);
      border-radius: 12px;
      text-decoration: none;
      color: var(--negro);
      margin-bottom: 12px;
      box-shadow: 0 2px 8px var(--sombra-suave);
      border: 1px solid #f0f0f0;
      border-left: 4px solid var(--verde-claro);
      transition: all 0.3s;
    }

    .link-card:hover {
      box-shadow: 0 4px 16px var(--sombra-media);
      transform: translateX(4px);
    }

    .link-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: white;
    }

    .link-icon.whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }
    .link-icon.facebook { background: linear-gradient(135deg, #1877F2, #0d5bbf); }
    .link-icon.instagram { background: linear-gradient(135deg, #E4405F, #C13584, #833AB4); }
    .link-icon.maps { background: linear-gradient(135deg, #4285F4, #34A853); }

    .link-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .link-content { flex: 1; }

    .link-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .link-subtitle {
      font-size: 13px;
      color: var(--gris-medio);
    }

    .link-arrow {
      color: var(--verde-claro);
      font-size: 24px;
    }

    .gallery-section {
      padding: 24px 20px;
    }

    .gallery-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .gallery-scroll::-webkit-scrollbar { height: 4px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--verde-claro); border-radius: 2px; }

    .gallery-item {
      flex: 0 0 140px;
      height: 140px;
      border-radius: 12px;
      overflow: hidden;
      scroll-snap-align: center;
      box-shadow: 0 2px 8px var(--sombra-suave);
      border: 2px solid var(--verde-claro);
      background: var(--blanco);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .leads-section {
      padding: 32px 20px;
      background: linear-gradient(135deg, var(--gris-claro), var(--blanco));
      border-top: 3px solid var(--verde-claro);
    }

    .form-container {
      background: var(--blanco);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px var(--sombra-media);
      border: 2px solid var(--verde-claro);
    }

    .form-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-header h2 {
      color: var(--verde-oscuro);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .form-header p {
      color: var(--gris-medio);
      font-size: 14px;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--negro);
      font-weight: 600;
      font-size: 14px;
    }

    .form-group label .required { color: var(--naranja); }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--verde-claro);
      box-shadow: 0 0 0 3px rgba(139, 195, 74, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--verde-claro);
    }

    .checkbox-group label {
      font-size: 13px;
      color: var(--gris-medio);
      font-weight: 400;
      margin: 0;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--verde-claro), var(--verde-medio));
      color: var(--blanco);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(139, 195, 74, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 195, 74, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-message {
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .form-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .form-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .footer {
      text-align: center;
      padding: 32px 20px;
      background: linear-gradient(135deg, var(--gris-claro), var(--blanco));
      border-top: 2px solid var(--verde-claro);
    }

    .footer-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .footer-btn {
      background: linear-gradient(135deg, var(--verde-claro), var(--verde-medio));
      border: none;
      color: var(--blanco);
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(139, 195, 74, 0.4);
    }

    .footer-btn:hover {
      box-shadow: 0 6px 16px rgba(139, 195, 74, 0.5);
      transform: translateY(-2px);
    }

    .footer-btn.secondary {
      background: var(--blanco);
      color: var(--verde-medio);
      border: 2px solid var(--verde-claro);
    }

    .footer-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .footer-text {
      font-size: 12px;
      color: var(--gris-medio);
      margin-top: 16px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gris-medio);
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--verde-claro);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      body { padding: 0; }
      .container { border-radius: 0; }
      .form-row { grid-template-columns: 1fr; }
    }

    @media (min-width: 768px) {
      body { padding: 40px 20px; }
      .container { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="loading">
      <div class="spinner"></div>
      <div>Cargando...</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby-G02al3V_mTHinABBHcIGzSVQmeKMfFLIILlWOUgJ7CFbdUGiECIY4ao2Ev_KYUkVag/exec';
    const NUEVO_LOGO = 'https://res.cloudinary.com/sdhnyr5e/image/upload/v1793814011/Retrato_Google_con_Sonrisa.png';

    async function loadCard() {
      try {
        const response = await fetch(API_URL + '?format=json&action=getCard&id=empresa');
        const result = await response.json();
        
        if (!result.success) {
          document.getElementById('app').innerHTML = '<div style="padding:20px;text-align:center;color:red;">Error al cargar</div>';
          return;
        }
        
        renderCard(result.data);
      } catch (error) {
        document.getElementById('app').innerHTML = '<div style="padding:20px;text-align:center;color:red;">Error de conexión</div>';
        console.error(error);
      }
    }
    
    function renderCard(data) {
      const { config, empleado, galeria, links } = data;
      const app = document.getElementById('app');
      
      const phone = config.empresa_whatsapp ? String(config.empresa_whatsapp).replace(/^(\+?52)?/, '').trim() : '';
      const phoneFmt = phone.length === 10 ? phone.slice(0,2) + ' ' + phone.slice(2,6) + ' ' + phone.slice(6) : phone;
      
      // Usar siempre el nuevo logo
      const logoUrl = NUEVO_LOGO;
      
      let html = '';
      
      html += '<div class="banner">';
      html += '<div class="logo-wrapper">';
      html += '<img src="' + logoUrl + '" alt="' + config.empresa_nombre + '">';
      html += '<div class="logo-badge">✓</div>';
      html += '</div>';
      html += '</div>';
      
      html += '<div class="header-info">';
      html += '<h1 class="company-name">' + (empleado.NOMBRE || config.empresa_nombre) + '</h1>';
      html += '<p class="tagline">' + (empleado.CARGO || config.empresa_tagline) + '</p>';
      html += '<div class="location-text">';
      html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>';
      html += '<span>' + config.empresa_ubicacion + '</span>';
      html += '</div>';
      html += '</div>';
      
      html += '<div class="quick-actions">';
      html += '<a href="https://wa.me/52' + phone + '?text=' + encodeURIComponent(config.empresa_whatsapp_msg || 'Hola') + '" target="_blank" class="action-btn">';
      html += '<div class="action-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>';
      html += '<span class="action-label">Mensaje</span></a>';
      html += '<a href="tel:' + phone + '" class="action-btn">';
      html += '<div class="action-icon"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div>';
      html += '<span class="action-label">Llamar</span></a>';
      html += '<button onclick="scrollToId(\'productos\')" class="action-btn">';
      html += '<div class="action-icon"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg></div>';
      html += '<span class="action-label">Catálogo</span></button>';
      html += '<button onclick="scrollToId(\'formulario\')" class="action-btn">';
      html += '<div class="action-icon" style="border-color:var(--naranja);"><svg viewBox="0 0 24 24" style="fill:var(--naranja);"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>';
      html += '<span class="action-label">Cotizar</span></button>';
      html += '</div>';
      
      html += '<div class="info-section">';
      html += '<div class="info-item"><div class="info-icon"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div>';
      html += '<div class="info-content"><div class="info-label">Teléfono</div><div class="info-value">' + phoneFmt + '</div></div></div>';
      html += '<div class="info-item"><div class="info-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>';
      html += '<div class="info-content"><div class="info-label">Dirección</div><div class="info-value">' + config.empresa_ubicacion + '</div></div></div>';
      html += '<div class="info-item"><div class="info-icon"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></div>';
      html += '<div class="info-content"><div class="info-label">Email</div><div class="info-value"><a href="mailto:' + config.empresa_email + '">' + config.empresa_email + '</a></div></div></div>';
      html += '<div class="info-item"><div class="info-icon"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></div>';
      html += '<div class="info-content"><div class="info-label">Sitio Web</div><div class="info-value"><a href="' + config.empresa_sitio + '" target="_blank">' + config.empresa_sitio.replace('https://', '') + '</a></div></div></div>';
      html += '</div>';
      
      if (links && links.length > 0) {
        html += '<div class="links-section"><h2 class="section-title">Redes Sociales</h2>';
        links.forEach(function(link) {
          var iconClass = link.ICONO || 'link';
          html += '<a href="' + link.URL + '" target="_blank" class="link-card">';
          html += '<div class="link-icon ' + iconClass + '"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>';
          html += '<div class="link-content"><div class="link-title">' + link.TITULO + '</div><div class="link-subtitle">' + link.SUBTITULO + '</div></div>';
          html += '<div class="link-arrow">›</div></a>';
        });
        html += '</div>';
      }
      
      if (galeria && galeria.length > 0) {
        html += '<div class="gallery-section" id="productos"><h2 class="section-title">Productos</h2><div class="gallery-scroll">';
        galeria.forEach(function(item) {
          html += '<div class="gallery-item"><img src="' + item.IMAGEN_URL + '" alt="' + item.DESCRIPCION + '" loading="lazy"></div>';
        });
        html += '</div></div>';
      }
      
      html += '<div class="leads-section" id="formulario">';
      html += '<div class="form-container">';
      html += '<div class="form-header"><h2>Solicita tu Cotización</h2><p>Te contactaremos en menos de 24 horas</p></div>';
      html += '<div id="formMsg" class="form-message"></div>';
      html += '<form id="leadForm" onsubmit="handleForm(event)">';
      html += '<div class="form-row">';
      html += '<div class="form-group"><label>Nombre <span class="required">*</span></label><input type="text" id="fNombre" required></div>';
      html += '<div class="form-group"><label>Teléfono <span class="required">*</span></label><input type="tel" id="fTel" required></div>';
      html += '</div>';
      html += '<div class="form-group"><label>Correo <span class="required">*</span></label><input type="email" id="fEmail" required></div>';
      html += '<div class="form-group"><label>Tipo de solicitud <span class="required">*</span></label><select id="fTipo" required><option value="">Selecciona...</option><option value="Información General">Información General</option><option value="Cotización Mayoreo">Cotización Mayoreo</option><option value="Distribuidor">Quiero ser Distribuidor</option><option value="Otro">Otro</option></select></div>';
      html += '<div class="form-group"><label>Productos de interés</label><input type="text" id="fProd"></div>';
      html += '<div class="form-group"><label>Mensaje</label><textarea id="fMsg"></textarea></div>';
      html += '<div class="form-group"><div class="checkbox-group"><input type="checkbox" id="fPriv" required><label for="fPriv">Acepto la política de privacidad <span class="required">*</span></label></div></div>';
      html += '<button type="submit" class="btn-submit" id="btnSubmit">Enviar Solicitud</button>';
      html += '</form></div></div>';
      
      html += '<div class="footer">';
      html += '<div class="footer-actions">';
      html += '<button class="footer-btn" onclick="downloadVCF()"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span>Guardar Contacto</span></button>';
      html += '<button class="footer-btn secondary" onclick="shareCard()"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg><span>Compartir</span></button>';
      html += '</div>';
      html += '<p class="footer-text">© 2026 ' + config.empresa_nombre + '</p>';
      html += '</div>';
      
      app.innerHTML = html;
    }
    
    function scrollToId(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
    
    async function handleForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const msg = document.getElementById('formMsg');
      
      const data = {
        nombre: document.getElementById('fNombre').value,
        telefono: document.getElementById('fTel').value,
        email: document.getElementById('fEmail').value,
        tipoSolicitud: document.getElementById('fTipo').value,
        productosInteres: document.getElementById('fProd').value,
        mensaje: document.getElementById('fMsg').value
      };
      
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'saveLead', lead: data })
        });
        
        const result = await response.json();
        
        if (result.success) {
          msg.className = 'form-message success';
          msg.textContent = '¡Enviado con éxito! Te contactaremos pronto.';
          document.getElementById('leadForm').reset();
        } else {
          msg.className = 'form-message error';
          msg.textContent = 'Error: ' + (result.error || 'Inténtalo de nuevo');
        }
      } catch (error) {
        msg.className = 'form-message error';
        msg.textContent = 'Error de conexión';
      }
      
      btn.disabled = false;
      btn.textContent = 'Enviar Solicitud';
    }
    
    function downloadVCF() {
      const vcf = 'BEGIN:VCARD\nVERSION:3.0\nFN:Grupo Sibrü\nORG:Grupo Sibrü\nTEL:+525549878203\nEND:VCARD';
      const blob = new Blob([vcf], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Grupo_Sibru.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function shareCard() {
      if (navigator.share) {
        navigator.share({ title: 'Grupo Sibrü', text: 'Visita nuestra tarjeta digital', url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copiado al portapapeles');
      }
    }
    
    loadCard();
  </script>
</body>
</html>
